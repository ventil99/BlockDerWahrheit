name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install browser-test dependencies
        working-directory: src/BlockDerWahrheit.Web
        run: npm ci
      - name: Install Chromium
        working-directory: src/BlockDerWahrheit.Web
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: src/BlockDerWahrheit.Web
        run: npm run test:browser
      - name: Set GitHub Pages base path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/BlockDerWahrheit.Web/wwwroot/index.html')
          html = path.read_text()
          assert '<base href="/" />' in html
          path.write_text(html.replace('<base href="/" />', '<base href="/BlockDerWahrheit/" />'))
          PY
      - name: Verify the published PWA offline
        working-directory: src/BlockDerWahrheit.Web
        env:
          PWA_BASE_PATH: /BlockDerWahrheit/
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5179/BlockDerWahrheit/
        run: npm run test:offline
      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
